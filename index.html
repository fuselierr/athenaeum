<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athenaeum</title>
    <link rel="icon" type="image/png" href="/appicon.png">
    <style>
        /* Only what has to be right before any script runs: the ground the
           page shows while the room loads. Every panel's look lives in
           src/ui/theme.css. */
        html, body { margin: 0; height: 100%; background: #1a0f1d; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="spine-rotation-panel">
        <label for="spine-rotation">Spine rotation <span id="spine-rotation-value"></span></label>
        <input id="spine-rotation" type="range" min="-1" max="1" step="0.01" value="0">
    </div>

    <!-- The Vue menu mounts here; see src/ui/mountMenu.js -->
    <div id="menu"></div>

    <div id="camera-mode"></div>

    <!-- The account control mounts here; see src/ui/mountAccount.js -->
    <div id="account"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
