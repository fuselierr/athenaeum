<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athenaeum</title>
    <style>
        html, body { margin: 0; height: 100%; background: #11141a; overflow: hidden; }
        canvas { display: block; }

        #hud {
            position: fixed; top: 12px; left: 12px; max-width: 340px;
            color: #cfd6e4; font: 13px/1.5 system-ui, sans-serif;
            background: rgba(20, 24, 32, 0.6); padding: 10px 14px; border-radius: 8px;
        }
        #hud b { color: #fff; }
        #hud button {
            margin-top: 8px; padding: 6px 12px; font: 13px/1.4 system-ui, sans-serif; color: #fff;
            background: #3a4258; border: 1px solid #4d5872; border-radius: 6px; cursor: pointer;
        }
        #hud button:hover { background: #4a5470; }

        #spine-rotation-panel {
            position: fixed; top: 12px; left: 12px; z-index: 2;
            color: #cfd6e4; font: 12px/1.4 system-ui, sans-serif;
            background: rgba(20, 24, 32, 0.75); padding: 8px 10px; border-radius: 8px; display: none;
        }
        #spine-rotation-panel input { width: 150px; vertical-align: middle; }
        #spine-rotation-value { display: inline-block; min-width: 42px; text-align: right; }

        /* Upload panel: POSTs the epub to the server conversion pipeline
           (see src/bookLoader.js) and reports status. */
        #upload-panel {
            position: fixed; bottom: 12px; right: 12px; z-index: 2; max-width: 260px;
            color: #cfd6e4; font: 12px/1.4 system-ui, sans-serif;
            background: rgba(20, 24, 32, 0.6); padding: 10px 14px; border-radius: 8px;
        }
        #upload-status {
            margin-top: 6px; min-height: 1.4em;
        }
    </style>
</head>
<body>

    <div id="spine-rotation-panel">
        <label for="spine-rotation">Spine rotation <span id="spine-rotation-value"></span></label>
        <input id="spine-rotation" type="range" min="-1" max="1" step="0.01" value="0">
    </div>

    <div id="upload-panel">
        <div>Upload an epub to convert it to page textures.</div>
        <input id="epub-file" type="file" accept=".epub"/>
        <div id="upload-status"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
